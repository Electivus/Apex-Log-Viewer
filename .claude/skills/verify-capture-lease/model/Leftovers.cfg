\* Three live processes start on the files two dead processes left: a dead holder's lease and the
\* reclaim marker of an elector that died inside reclaimDeadLease (Reach.cfg shows both are reachable).
\* One more process can die at any step, so a second dead elector, and a race on the next marker, are in.
CONSTANTS
  Procs = {1, 2, 3}
  MaxTokens = 5
  MaxCrashes = 1
  Leftovers = TRUE
  UserDeletes = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK OneCapturer NoLiveTheft
CHECK_DEADLOCK FALSE
