packages:
  - apps/*
  - packages/*

sharedWorkspaceLockfile: true
strictPeerDependencies: true
pmOnFail: error
verifyDepsBeforeRun: error
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude: []
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'chokidar@4.0.3'
  - 'pino@9.14.0'
  - 'semver@5.7.2'
  - 'semver@6.3.1'
  - 'undici-types@6.21.0'

overrides:
  # babel-plugin-istanbul 8 asks for test-exclude 7, which asks for the deprecated glob 10 and,
  # through it, the deprecated minimatch 9. Remove this override once test-exclude no longer asks
  # for glob 10. #1380 tracks the move to glob 14 and minimatch 11.
  'test-exclude@7>glob': '^13.0.6'

supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - arm64
    - x64

allowBuilds:
  '@parcel/watcher': true
  '@vscode/vsce-sign': true
  esbuild: true
  fsevents: true
  keytar: true
  unrs-resolver: true
