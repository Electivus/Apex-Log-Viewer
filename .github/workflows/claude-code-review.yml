name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Cancel a superseded review when new commits land on the same PR.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork and Dependabot PRs do not receive ANTHROPIC_API_KEY, so skip them.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      # Pin the review plugin marketplace to an immutable revision.
      - name: Checkout Claude Code review plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: anthropics/claude-code
          ref: 7779afb12e3635f46f56ec823979d68350ae000b
          path: .claude-code-plugins
          persist-credentials: false
          sparse-checkout: |
            .claude-plugin
            plugins/code-review

      # Claude Code reserves the upstream marketplace name for GitHub sources in
      # the anthropics org, so rename the pinned local copy before adding it.
      - name: Rename pinned review plugin marketplace
        run: |
          jq '.name = "electivus-claude-code-plugins"' \
            .claude-code-plugins/.claude-plugin/marketplace.json > marketplace.json.tmp
          mv marketplace.json.tmp .claude-code-plugins/.claude-plugin/marketplace.json

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: './.claude-code-plugins'
          plugins: 'code-review@electivus-claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

