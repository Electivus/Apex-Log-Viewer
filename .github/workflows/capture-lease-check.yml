name: Capture Lease Check

on:
  pull_request:
    paths:
      - packages/core/src/localStore/workspaceFs.ts
      - packages/core/src/customLogs/events/store.ts
      - .agents/skills/verify-capture-lease/**
      - .github/workflows/capture-lease-check.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture_lease_check:
    name: Capture lease check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enforce dependency source policy
        run: node scripts/check-dependency-sources.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check the capture lease
        run: node .agents/skills/verify-capture-lease/scripts/check.mjs
