name: diag-cometd-crash
on:
  push:
    branches:
      - diag/cometd-win-crash
permissions:
  contents: read
jobs:
  hammer:
    name: hammer (${{ matrix.shard }} node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: old-a, node: 24.15.0, variants: 'cli,cli-lan,plain-lan,plain-dns', scenarios: 'down,down,start', concurrency: 3, burners: 1, cdb: '' }
          - { shard: old-b, node: 24.15.0, variants: 'cli,cli-lan,plain-lan,plain-dns', scenarios: 'down,down,start', concurrency: 3, burners: 1, cdb: '' }
          - { shard: old-dbg, node: 24.15.0, variants: 'plain-lan,plain-dns', scenarios: 'down', concurrency: 2, burners: 1, cdb: '1' }
          - { shard: new-a, node: 24.22.2, variants: 'plain,tsx,plain-lan,plain-dns,cli', scenarios: 'down,down,down,start', concurrency: 3, burners: 1, cdb: '' }
          - { shard: new-b, node: 24.22.2, variants: 'plain,tsx,plain-lan,plain-dns,cli', scenarios: 'down,down,down,start', concurrency: 3, burners: 1, cdb: '' }
    env:
      DIAG_OUT: D:\diag
      DIAG_SHARD: ${{ matrix.shard }}
      DIAG_MINUTES: '35'
      DIAG_CONCURRENCY: ${{ matrix.concurrency }}
      DIAG_BURNERS: ${{ matrix.burners }}
      DIAG_VARIANTS: ${{ matrix.variants }}
      DIAG_SCENARIOS: ${{ matrix.scenarios }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alv/core run build
      - name: Bundle the children without tsx
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:\diag\dumps | Out-Null
          pnpm exec esbuild packages/core/test/support/cometdAbortChild.ts --bundle --platform=node --format=cjs --external:@salesforce/core --outfile=packages/core/test/support/.cometdAbortChild.plain.cjs --log-level=warning
          $banner = "import { createRequire as __cr } from 'node:module'; import { fileURLToPath as __f2p } from 'node:url'; import { dirname as __dn } from 'node:path'; const require = __cr(import.meta.url); const __filename = __f2p(import.meta.url); const __dirname = __dn(__filename);"
          pnpm exec esbuild .diag/cliChild.ts --bundle --platform=node --format=esm --external:@salesforce/core --external:@oclif/core --external:@salesforce/sf-plugins-core --external:@salesforce/kit --external:@salesforce/ts-types --outfile=packages/sf-plugin/test/.cliChild.plain.mjs --log-level=warning "--banner:js=$banner"
      - name: Reproducer by address kind
        if: matrix.cdb != '1'
        run: node .diag/repro-runner.mjs
      - name: Hammer
        shell: pwsh
        working-directory: packages/core
        run: |
          if ('${{ matrix.cdb }}' -eq '1') {
            $env:DIAG_CDB = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          }
          node --version
          node --import tsx ../../.diag/hammer.ts
          exit 0
      - name: Analyze dumps
        if: always()
        shell: pwsh
        run: |
          $dumps = @(Get-ChildItem D:\diag\dumps\*.dmp -ErrorAction SilentlyContinue)
          "dumps: $($dumps.Count)"
          $dumps | Select-Object -Skip 3 | Remove-Item -Force
          if ($dumps.Count -eq 0) { exit 0 }
          $version = node --version
          Invoke-WebRequest "https://nodejs.org/dist/$version/win-x64/node_pdb.zip" -OutFile D:\diag\node_pdb.zip
          Expand-Archive D:\diag\node_pdb.zip D:\diag\pdb -Force
          Remove-Item D:\diag\node_pdb.zip
          $env:_NT_SYMBOL_PATH = 'D:\diag\pdb;srv*D:\diag\sym*https://msdl.microsoft.com/download/symbols'
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          foreach ($dump in ($dumps | Select-Object -First 3)) {
            "===== $($dump.Name) $($dump.Length)"
            & $cdb -z $dump.FullName -lines -c '.exr -1; .ecxr; kn 40; q' 2>&1 | Tee-Object -FilePath "D:\diag\$($dump.BaseName).analysis" | Select-Object -Last 70
          }
          Remove-Item D:\diag\pdb,D:\diag\sym -Recurse -Force -ErrorAction SilentlyContinue
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: diag2-${{ matrix.shard }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            D:\diag\results-*.jsonl
            D:\diag\*.analysis
            D:\diag\dumps\*.dmp
