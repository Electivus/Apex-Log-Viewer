version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Bahia'
    open-pull-requests-limit: 10
    # Exceed pnpm's one-day minimum release age without delaying security updates.
    cooldown:
      default-days: 3
    groups:
      # react and react-dom must share one version; react-dom throws on a mismatch.
      react:
        applies-to: version-updates
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      react-security:
        applies-to: security-updates
        patterns:
          - 'react'
          - 'react-dom'
    ignore:
      # TS 7 is outside the ts-jest and typescript-eslint parser peer ranges.
      # Revisit with a coordinated compiler and test-transformer migration (#980).
      - dependency-name: 'typescript'
        versions: ['>=7.0.0 <8.0.0']
      # sf-plugins-core 12 exports oclif 4 flag types; v5 breaks declarations (#1092).
      - dependency-name: '@oclif/core'
        versions: ['>=5.0.0 <6.0.0']
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/vscode'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@salesforce/sf-plugins-core'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '06:00'
      timezone: 'America/Bahia'
    open-pull-requests-limit: 3
  - package-ecosystem: 'docker'
    directories:
      - '/.devcontainer'
      - '/test/e2e/proxy-lab'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '06:00'
      timezone: 'America/Bahia'
    open-pull-requests-limit: 3
    ignore:
      # The runner image tag is the Node release in .nvmrc and moves with it by hand.
      # Dependabot still refreshes the digest of that tag.
      - dependency-name: 'node'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      # The devcontainer stays on the Node major in .nvmrc.
      - dependency-name: '*typescript-node'
        update-types:
          - 'version-update:semver-major'
