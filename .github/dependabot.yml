version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Bahia'
    open-pull-requests-limit: 10
    # Exceed pnpm's one-day minimum release age without delaying security updates.
    cooldown:
      default-days: 3
    groups:
      # scripts/run-playwright-e2e.test.js requires both ranges to stay identical.
      playwright:
        patterns:
          - 'playwright'
          - '@playwright/test'
    ignore:
      # TS 7 removes baseUrl/Node10 resolution and is outside ts-jest/parser peers.
      # Revisit with a coordinated compiler and test-transformer migration (#980).
      - dependency-name: 'typescript'
        versions: ['>=7.0.0 <8.0.0']
      # sf-plugins-core 12 exports oclif 4 flag types; v5 breaks declarations (#1092).
      - dependency-name: '@oclif/core'
        versions: ['>=5.0.0 <6.0.0']
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/vscode'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@salesforce/sf-plugins-core'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '06:00'
      timezone: 'America/Bahia'
    open-pull-requests-limit: 3
