version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Bahia'
    open-pull-requests-limit: 25
    # Exceed pnpm's one-day minimum release age without delaying security updates.
    cooldown:
      default-days: 3
    groups:
      # react and react-dom must share one version; react-dom throws on a mismatch.
      react:
        applies-to: version-updates
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      react-security:
        applies-to: security-updates
        patterns:
          - 'react'
          - 'react-dom'
    ignore:
      # `typescript` stays on 6.x: TypeScript 7 drops the 6.0 compiler API that ts-jest, typescript-eslint,
      # scripts/gen-l10n.cjs and the editor's tsserver load. Type checks run TypeScript 7 from the
      # `typescript7` alias (#1406).
      - dependency-name: 'typescript'
        versions: ['>=7.0.0 <8.0.0']
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/vscode'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '06:00'
      timezone: 'America/Bahia'
    open-pull-requests-limit: 3
  - package-ecosystem: 'docker'
    directories:
      - '/.devcontainer'
      - '/test/e2e/proxy-lab'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '06:00'
      timezone: 'America/Bahia'
    open-pull-requests-limit: 3
    ignore:
      # The runner image tag is the Node release in .nvmrc and moves with it by hand.
      # Dependabot still refreshes the digest of that tag.
      - dependency-name: 'node'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      # The devcontainer stays on the Node major in .nvmrc.
      - dependency-name: '*typescript-node'
        update-types:
          - 'version-update:semver-major'
